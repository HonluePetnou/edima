# Edima — fine-tuning M2M100-418M for Duala (dua)
model:
  base: facebook/m2m100_418M
  dua_token: "__dua__"
  # Warm-start the new Duala embedding from related Bantu languages.
  related_langs: [ln, lg, rw, ny, sw, zu, xh]

data:
  mt560: michsethowusu/english-duala_sentence-pairs_mt560
  bouquet: facebook/bouquet
  max_length: 128          # tokenizer truncation length
  max_words: 200           # pre-tokenization length filter
  min_length: 1
  length_ratio_min: 0.5
  length_ratio_max: 2.0
  val_fraction: 0.05
  test_fraction: 0.05
  seed: 42

synthetic:
  # Translate the English side of MT560 to French with M2M100 (EN->FR) so the
  # model also learns the FR->DUA direction used by the banking extension.
  enabled: true
  batch_size: 32
  num_beams: 1
  max_length: 128

train:
  output_dir: out/m2m100_dua
  per_device_train_batch_size: 8
  per_device_eval_batch_size: 8
  gradient_accumulation_steps: 4
  learning_rate: 0.00003
  num_train_epochs: 5
  warmup_steps: 500
  fp16: true
  gradient_checkpointing: true
  eval_steps: 200
  save_steps: 200
  save_total_limit: 2
  logging_steps: 50
  seed: 42

eval:
  batch_size: 16
  max_length: 128
  num_beams: 4

export:
  output_dir: models/m2m100_dua_ct2
  quantization: int8
